<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Jun Park." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>jun park</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <canvas id="scene" aria-label="A Magic Choc vanilla ice cream. Tap it to crack the chocolate shell; it melts slowly."></canvas>

    <div class="controls">
      <div class="weather" role="radiogroup" aria-label="Weather (how fast it melts)"></div>
    </div>
    <div class="flavors" aria-label="Ice cream flavor"></div>
    <button class="sound-toggle" type="button" aria-label="Mute sounds" aria-pressed="false" title="Mute sounds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="sound-waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /><path class="sound-off" d="m16 9 5 6m0-6-5 6" /></svg>
    </button>
    <button class="reset" type="button" aria-label="Get a new ice cream" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" /><path d="M4.5 4.5v3.2h3.2" /></svg>
    </button>

    <noscript><p class="fallback">Jun Park</p></noscript>
    <p class="fallback fallback--webgl">Jun Park</p>
  </body>
</html>
